name: Build ZN-M2 OpenWrt

on:
  workflow_dispatch:
  push:
    branches:
      - zn-m2-wifi

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged \
            help2man intltool libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full \
            patch pkgconf python2.7 python3 python3-pip python3-setuptools qemu-utils \
            rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone Asia/Shanghai
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source
        working-directory: /workdir
        run: |
          git clone --depth=1 --single-branch -b zn-m2-wifi \
            https://github.com/formathhh/lede-zn-m2-wifi.git openwrt
          echo "OPENWRT_PATH=/workdir/openwrt" >> $GITHUB_ENV

      - name: Update feeds
        working-directory: /workdir/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config
        working-directory: /workdir/openwrt
        run: |
          [ -f .config ] && cp .config .config.bak || true

      - name: Generate config
        working-directory: /workdir/openwrt
        run: |
          make defconfig

      - name: Download package
        working-directory: /workdir/openwrt
        run: |
          make -j8 download V=s

      - name: Compile the firmware
        working-directory: /workdir/openwrt
        run: |
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-ZN-M2
          path: /workdir/openwrt/bin/targets/qualcommax/ipq60xx/*
