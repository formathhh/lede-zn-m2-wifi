name: Build ZN-M2 OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged \
            help2man intltool libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full \
            patch pkgconf python2.7 python3 python3-pip python3-setuptools qemu-utils \
            rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone Asia/Shanghai
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source
        working-directory: /workdir
        run: |
          git clone --depth=1 --single-branch -b zn-m2-wifi \
            https://github.com/formathhh/lede-zn-m2-wifi.git openwrt
          echo "OPENWRT_PATH=/workdir/openwrt" >> $GITHUB_ENV

      - name: Prepare feeds
        working-directory: /workdir/openwrt
        run: |
          sed -i 's|^src-git telephony|#src-git telephony|' feeds.conf.default
          cat feeds.conf.default

      - name: Update feeds
        working-directory: /workdir/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Check feeds
        working-directory: /workdir/openwrt
        run: |
          echo "===== ddns-scripts 相关 ====="
          ls -d package/feeds/packages/ddns-scripts* 2>/dev/null || echo "ddns-scripts NOT FOUND"
          echo "===== luci-lua-runtime 相关 ====="
          find package/feeds/luci -maxdepth 2 -iname "*lua-runtime*" 2>/dev/null || echo "luci-lua-runtime NOT FOUND"
          echo "===== passwall 相关 ====="
          ls -d package/feeds/*/luci-app-passwall 2>/dev/null || echo "luci-app-passwall NOT FOUND"

      - name: Load custom .config
        working-directory: /workdir/openwrt
        run: |
          # 关键：确认仓库里的 .config 真的被 clone 下来了
          if [ ! -f .config ]; then
            echo "ERROR: 仓库里没有 .config，自选配置不会生效！"
            exit 1
          fi
          echo "===== 仓库 .config 行数 ====="
          wc -l .config
          echo "===== 自选项预检 ====="
          grep -E "luci-app-passwall|xray-core|sing-box|cmiot_ax18" .config || true

      - name: Configure
        working-directory: /workdir/openwrt
        run: |
          # 用仓库 .config 生成自洽配置，不要 append
          make defconfig
          echo "===== defconfig 后关键项 ====="
          grep -E "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_cmiot_ax18" .config || echo "TARGET MISSING"
          grep -c "CONFIG_PACKAGE_luci-app-passwall=y" .config || true
          grep -E "CONFIG_PACKAGE_xray-core" .config || true
          grep -E "CONFIG_PACKAGE_sing-box" .config || true

      - name: Download package
        working-directory: /workdir/openwrt
        run: |
          make -j8 download V=s || make -j8 download V=s

      - name: Compile the firmware
        working-directory: /workdir/openwrt
        run: |
          make -j$(nproc) V=s || make -j1 V=s

      - name: Verify passwall
        working-directory: /workdir/openwrt
        run: |
          echo "===== passwall 检查 ====="
          grep -c "luci-app-passwall" .config || true
          ls bin/targets/qualcommax/ipq60xx/packages/ | grep -i passwall || echo "PASSWALL IPK NOT FOUND"
          ls bin/targets/qualcommax/ipq60xx/packages/ | grep -i xray || echo "XRAY IPK NOT FOUND"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-ZN-M2
          path: /workdir/openwrt/bin/targets/qualcommax/ipq60xx/*
