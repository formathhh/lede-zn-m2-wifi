name: Build ZN-M2 OpenWrt

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged \
            help2man intltool libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full \
            patch pkgconf python2.7 python3 python3-pip python3-setuptools qemu-utils \
            rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone Asia/Shanghai
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source
        working-directory: /workdir
        run: |
          git clone --depth=1 --single-branch -b zn-m2-wifi \
            https://github.com/formathhh/lede-zn-m2-wifi.git openwrt
          echo "OPENWRT_PATH=/workdir/openwrt" >> $GITHUB_ENV

      - name: Prepare feeds
        working-directory: /workdir/openwrt
        run: |
          sed -i 's|^src-git telephony|#src-git telephony|' feeds.conf.default
          cat feeds.conf.default

      - name: Update feeds
        working-directory: /workdir/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config
        working-directory: /workdir/openwrt
        run: |
          # 关键改动：用仓库里的 .config 覆盖源码默认配置
          cp .config .config.bak
          cp .config openwrt.config
          # 用 defconfig 强制以你的 .config 为准生成配置
          make defconfig
          # 打印关键项，方便在日志里核对
          echo "===== 检查配置项 ====="
          grep -E "CONFIG_PACKAGE_luci-app-(passwall|zerotier|pgyvpn|turboacc|ssr-plus)" .config || true
          grep -E "CONFIG_DEFAULT_luci-app-ssr-plus" .config || true

      - name: Download package
        working-directory: /workdir/openwrt
        run: |
          make -j8 download V=s

      - name: Compile the firmware
        working-directory: /workdir/openwrt
        run: |
          make -j$(nproc) V=s || make -j1 V=s

      - name: Verify passwall
        working-directory: /workdir/openwrt
        run: |
          echo "===== passwall 检查 ====="
          grep -c "luci-app-passwall" .config || true
          ls bin/targets/qualcommax/ipq60xx/packages/ | grep -i passwall || echo "PASSWALL IPK NOT FOUND"
          echo "===== ssr-plus 检查（应尽量不出现）====="
          ls bin/targets/qualcommax/ipq60xx/packages/ | grep -i ssr-plus || echo "SSR-PLUS IPK NOT FOUND"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-ZN-M2
          path: /workdir/openwrt/bin/targets/qualcommax/ipq60xx/*
