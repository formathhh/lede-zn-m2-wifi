name: Build ZN-M2 OpenWrt

on:
  workflow_dispatch:
  push:
    branches:
      - zn-m2-wifi

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged \
            help2man intltool libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full \
            patch pkgconf python2.7 python3 python3-pip python3-setuptools qemu-utils \
            rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone Asia/Shanghai
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source
        working-directory: /workdir
        run: |
          git clone --depth=1 --single-branch -b zn-m2-wifi \
            https://github.com/formathhh/lede-zn-m2-wifi.git openwrt
          echo "OPENWRT_PATH=/workdir/openwrt" >> $GITHUB_ENV

      - name: Add passwall feeds
        working-directory: /workdir/openwrt
        run: |
          sed -i '1i src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' feeds.conf.default
          sed -i '1i src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' feeds.conf.default
          cat feeds.conf.default

      - name: Update feeds
        working-directory: /workdir/openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate config
        working-directory: /workdir/openwrt
        run: |
          cp .config .config.bak
          make defconfig
          echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy=y" >> .config
          echo "CONFIG_PACKAGE_xray-core=y" >> .config
          echo "CONFIG_PACKAGE_sing-box=y" >> .config
          echo "CONFIG_PACKAGE_chinadns-ng=y" >> .config
          echo "CONFIG_PACKAGE_haproxy=y" >> .config
          echo "CONFIG_PACKAGE_dns2socks=y" >> .config
          echo "CONFIG_PACKAGE_microsocks=y" >> .config
          echo "CONFIG_PACKAGE_iptables-mod-tproxy=y" >> .config
          echo "CONFIG_PACKAGE_iptables-mod-extra=y" >> .config
          echo "CONFIG_PACKAGE_ipset=y" >> .config
          echo "CONFIG_PACKAGE_libopenssl=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y" >> .config

      - name: Download package
        working-directory: /workdir/openwrt
        run: |
          make -j8 download V=s

      - name: Compile the firmware
        working-directory: /workdir/openwrt
        run: |
          make -j$(nproc) V=s || make -j1 V=s

      - name: Verify passwall
        working-directory: /workdir/openwrt
        run: |
          grep -c "luci-app-passwall" .config || true
          ls bin/targets/qualcommax/ipq60xx/packages/ | grep -i passwall || echo "PASSWALL IPK NOT FOUND"
          ls bin/targets/qualcommax/ipq60xx/packages/ | grep -i xray || echo "XRAY IPK NOT FOUND"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-ZN-M2
          path: /workdir/openwrt/target/linux/qualcommax/ipq60xx/*
